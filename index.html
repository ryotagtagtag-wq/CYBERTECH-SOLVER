<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBERTECH // MATRIX 10-PUZZLE SOLVER</title>
    <style>
        :root {
            --bg-color: #050b14;
            --panel-color: #0b1528;
            --neon-green: #00ff66;
            --neon-glow: rgba(0, 255, 102, 0.3);
            --text-color: #00ff66;
            --muted-text: #4ade80;
            --border-color: #00ff66;
        }

        body {
            font-family: 'Courier New', Courier, monospace, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            max-width: 650px;
            margin: 0 auto;
            text-shadow: 0 0 5px var(--neon-glow);
        }

        .cyber-panel {
            background: var(--panel-color);
            border: 2px solid var(--border-color);
            padding: 25px;
            border-radius: 4px;
            box-shadow: 0 0 15px var(--neon-glow), inset 0 0 10px rgba(0,255,102,0.1);
            margin-bottom: 25px;
            position: relative;
            overflow: hidden;
        }

        .cyber-panel::before {
            content: "SYSTEM ONLINE";
            position: absolute;
            top: 5px;
            right: 10px;
            font-size: 0.7rem;
            opacity: 0.6;
            letter-spacing: 2px;
        }

        h1 {
            margin-top: 0;
            font-size: 1.6rem;
            text-align: center;
            letter-spacing: 3px;
            border-bottom: 1px dashed var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        .row {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        .flex-1 { flex: 1; }
        
        label {
            display: block;
            font-size: 0.8rem;
            margin-bottom: 8px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        input {
            width: 100%;
            padding: 12px;
            background: #000;
            border: 1px solid var(--border-color);
            border-radius: 0;
            color: var(--neon-green);
            font-family: inherit;
            font-size: 1.2rem;
            text-align: center;
            box-sizing: border-box;
            outline: none;
            box-shadow: inset 0 0 5px rgba(0,255,102,0.2);
        }

        input:focus {
            box-shadow: 0 0 10px var(--neon-glow), inset 0 0 5px rgba(0,255,102,0.4);
        }

        .toggle-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 25px;
            font-size: 0.85rem;
            cursor: pointer;
        }

        .toggle-row input {
            width: auto;
            margin: 0;
            cursor: pointer;
            accent-color: var(--neon-green);
        }

        .cyber-btn {
            width: 100%;
            padding: 15px;
            background: transparent;
            color: var(--neon-green);
            border: 2px solid var(--border-color);
            font-size: 1.1rem;
            font-weight: bold;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s ease;
            letter-spacing: 2px;
        }

        .cyber-btn:hover {
            background: var(--neon-green);
            color: #000;
            box-shadow: 0 0 20px var(--neon-glow);
            text-shadow: none;
        }

        #output-header {
            font-size: 1rem;
            margin-bottom: 12px;
            letter-spacing: 1px;
            border-left: 4px solid var(--border-color);
            padding-left: 10px;
        }

        .list-container {
            max-height: 350px;
            overflow-y: auto;
            border: 1px solid rgba(0, 255, 102, 0.4);
            background: #02060d;
        }

        /* カスタムスクールバー */
        .list-container::-webkit-scrollbar { width: 8px; }
        .list-container::-webkit-scrollbar-track { background: #000; }
        .list-container::-webkit-scrollbar-thumb { background: var(--border-color); }

        .item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            border-bottom: 1px solid rgba(0, 255, 102, 0.2);
            font-size: 1.1rem;
        }

        .item:hover {
            background: rgba(0, 255, 102, 0.05);
        }

        .copy-btn {
            background: transparent;
            color: var(--muted-text);
            border: 1px solid var(--muted-text);
            padding: 4px 10px;
            font-size: 0.8rem;
            font-family: inherit;
            cursor: pointer;
        }

        .copy-btn:hover {
            background: var(--muted-text);
            color: #000;
            text-shadow: none;
        }
    </style>
</head>
<body>

<div class="cyber-panel">
    <h1>[ COGNITIVE_MATH_CORE v1.4 ]</h1>
    
    <div class="row">
        <div class="flex-1">
            <label for="digits">> INPUT_DIGITS (4桁)</label>
            <input type="text" id="digits" value="6431" placeholder="6431" maxlength="4">
        </div>
        <div style="width: 120px;">
            <label for="target">> TARGET_VAL</label>
            <input type="number" id="target" value="10">
        </div>
    </div>

    <div class="toggle-row">
        <input type="checkbox" id="filter-dup" checked>
        <label for="filter-dup">DUPLICATE_FILTER_ON (重複排除)</label>
    </div>

    <button class="cyber-btn" onclick="solvePuzzle()">EXECUTE_SEARCH()</button>
</div>

<div class="cyber-panel">
    <div id="output-header">> CONSOLE_OUTPUT: 待機中...</div>
    <div class="list-container" id="result-list"></div>
</div>

<script>
const operators = ['+', '-', '*', '/'];

function standardize(expr) {
    return expr.replace(/\s+/g, '')
               .replace(/\(([^+-/*]+)\+([^+-/*]+)\)/g, (m, a, b) => a > b ? `(${b}+${a})` : `(${a}+${b})`)
               .replace(/\(([^+-/*]+)\*([^+-/*]+)\)/g, (m, a, b) => a > b ? `(${b}*${a})` : `(${a}*${b})`);
}

function solvePuzzle() {
    const digitsInput = document.getElementById('digits').value;
    const target = parseFloat(document.getElementById('target').value);
    const filterDup = document.getElementById('filter-dup').checked;
    const listContainer = document.getElementById('result-list');
    const outputHeader = document.getElementById('output-header');
    
    listContainer.innerHTML = '';

    if (digitsInput.length !== 4 || !/^\d+$/.test(digitsInput)) {
        alert('ERROR: 4桁の数値を入力してください。');
        return;
    }

    const digits = digitsInput.split('').map(Number);
    const uniqueSolutions = new Set();
    const seenStandardized = new Set();

    function permute(arr) {
        if (arr.length === 0) return [[]];
        return arr.flatMap((v, i) => permute(arr.filter((_, j) => i !== j)).map(p => [v, ...p]));
    }

    const numPerms = permute(digits);

    for (const p of numPerms) {
        for (const op1 of operators) {
            for (const op2 of operators) {
                for (const op3 of operators) {
                    const templates = [
                        `(((${p} ${op1} ${p}) ${op2} ${p}) ${op3} ${p})`,
                        `((${p} ${op1} (${p} ${op2} ${p})) ${op3} ${p})`,
                        `(${p} ${op1} ((${p} ${op2} ${p}) ${op3} ${p}))`,
                        `(${p} ${op1} (${p} ${op2} (${p} ${op3} ${p})))`,
                        `((${p} ${op1} ${p}) ${op2} (${p} ${op3} ${p}))`
                    ];

                    for (const expr of templates) {
                        try {
                            const res = new Function(`return ${expr}`)();
                            if (Math.abs(res - target) < 1e-9) {
                                const cleanExpr = expr.replace(/\s+/g, '');
                                if (filterDup) {
                                    const std = standardize(cleanExpr);
                                    if (!seenStandardized.has(std)) {
                                        seenStandardized.add(std);
                                        uniqueSolutions.add(cleanExpr);
                                    }
                                } else {
                                    uniqueSolutions.add(cleanExpr);
                                }
                            }
                        } catch (e) {}
                    }
                }
            }
        }
    }

    const solutionsArray = Array.from(uniqueSolutions).sort();
    outputHeader.innerText = `> SOLUTIONS_FOUND: ${solutionsArray.length} CELLS MATCHED`;

    if (solutionsArray.length === 0) {
        listContainer.innerHTML = '<div class="item" style="color: #ef4444;">> STATUS: NO_MATCHES_FOUND</div>';
        return;
    }

    solutionsArray.forEach(sol => {
        const item = document.createElement('div');
        item.className = 'item';
        
        const code = document.createElement('span');
        code.innerText = `${sol} = ${target}`;
        
        const btn = document.createElement('button');
        btn.className = 'copy-btn';
        btn.innerText = 'COPY';
        btn.onclick = () => {
            navigator.clipboard.writeText(`${sol} = ${target}`);
            btn.innerText = 'COPIED';
            setTimeout(() => btn.innerText = 'COPY', 1000);
        };

        item.appendChild(code);
        item.appendChild(btn);
        listContainer.appendChild(item);
    });
}
</script>
</body>
</html>
